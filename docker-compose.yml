version: "3.8"

services:
  master:
    build: .
    command: ["./main", "master"]
    ports:
      - "9092:9092"   # HTTP API + Dashboard
      - "50051:50051" # gRPC
    environment:
      - GRPC_PORT=:50051
      - HTTP_PORT=:9092
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - TASK_QUEUE_SIZE=100
      - HEARTBEAT_INTERVAL=10s
      - HEARTBEAT_TIMEOUT=30s
      - WORKER_DEAD_TIMEOUT=60s
    volumes:
      - ./test_scripts:/etc/scripts:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9092/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker-1:
    build: .
    command: ["./main", "worker"]
    environment:
      - MASTER_ADDR=master:50051
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - HEARTBEAT_INTERVAL=10s
    volumes:
      - ./test_scripts:/etc/scripts:ro
    depends_on:
      master:
        condition: service_healthy

  worker-2:
    build: .
    command: ["./main", "worker"]
    environment:
      - MASTER_ADDR=master:50051
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - HEARTBEAT_INTERVAL=10s
    volumes:
      - ./test_scripts:/etc/scripts:ro
    depends_on:
      master:
        condition: service_healthy

  worker-3:
    build: .
    command: ["./main", "worker"]
    environment:
      - MASTER_ADDR=master:50051
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - HEARTBEAT_INTERVAL=10s
    volumes:
      - ./test_scripts:/etc/scripts:ro
    depends_on:
      master:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - master

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
